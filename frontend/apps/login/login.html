<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Pastejo Rotacionado</title>
  <link rel="stylesheet" href="/apps/shared/style.css">
</head>
<body>
  <div class="login-wrap">
    <form id="formLogin" class="login-card">
      <h1>rota-rota jequiti</h1>
      <img src="../../img/jequiti.png" alt="silvio" class="silvio">
      <p>Entre para acessar o sistema</p>
      <div id="erro" class="aviso erro" hidden></div>
      <label>Login<input type="text" id="login" autocomplete="username" maxlength="50" pattern="[A-Za-z0-9._@+-]{1,50}" title="Use até 50 letras, números, ponto, underline, @, + ou hífen." required autofocus></label>
      <label>Senha<input type="password" id="senha" autocomplete="current-password" required></label>
      <button type="submit" class="btn">Entrar</button>
      <div id="carregando" class="login-loading" role="status" aria-live="polite" hidden>
        <img src="../../img/roda.png" alt="">
      </div>
    </form>
  </div>
  <script src="/config.js"></script>
  <script src="/apps/shared/auth.js"></script>
  <script src="/apps/shared/api.js"></script>
  <script src="/apps/login/vwLogin.js"></script>
</body>
</html>
